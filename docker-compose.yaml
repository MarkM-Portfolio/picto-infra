name: ${REPO_NAME}

services:
  # 🧩 Container Registry (local)
  registry-store:
    profiles: [ "container-registry" ]
    build:
      context: .
      dockerfile: Dockerfile.registry
      args:
        CONTAINER_REGISTRY_PVC: ${CONTAINER_REGISTRY_PVC}
        CONTAINER_REGISTRY_DELETE_ENABLED: ${CONTAINER_REGISTRY_DELETE_ENABLED}
        CONTAINER_REGISTRY_PORT: ${CONTAINER_REGISTRY_PORT}
    image: localhost:${CONTAINER_REGISTRY_LOCAL_PORT}/registry:latest
    container_name: ${CONTAINER_REGISTRY_NAME}
    env_file:
      - ./.env
    ports:
      - ${CONTAINER_REGISTRY_LOCAL_PORT}:${CONTAINER_REGISTRY_PORT}
    volumes:
      - ./registry:/var/lib/registry # bind mount ovverride
      - registry-data:${CONTAINER_REGISTRY_PVC}
    networks:
      - docker-network
    restart: always

  # # 🔐 MKCert CA Server
  # ca-server:
  #   profiles: ["cert-store"]
  #   build:
  #     context: .
  #     dockerfile_inline: |
  #       FROM nginx:alpine
  #   image: localhost:${CONTAINER_REGISTRY_LOCAL_PORT}/ca-server:latest
  #   container_name: ca-server
  #   env_file:
  #     - ./.env
  #   ports:
  #     - ${CA_SERVER_PORT}:80
  #   networks:
  #     - docker-network
  #   restart: always
  
  # 🧱 MySQL
  mysql:
    profiles: [ "infra" ]
    build:
      context: .
      dockerfile: Dockerfile.mysql
      args:
        MYSQL_VER: ${MYSQL_VER}
        MYSQL_PVC: ${MYSQL_PVC}
        MYSQL_PORT: ${MYSQL_PORT}
    image: localhost:${CONTAINER_REGISTRY_LOCAL_PORT}/mysql:latest
    container_name: mysql
    env_file:
      - ./.env
    ports:
      - ${MYSQL_PORT}:${MYSQL_PORT}
    volumes:
      - mysql-data:${MYSQL_PVC}
      # - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - docker-network
    restart: unless-stopped

  # 📊 Node Exporter (host-level metrics)
  node-exporter:
    profiles: [ "infra" ]
    build:
      context: .
      dockerfile: Dockerfile.node-exporter
    image: localhost:${CONTAINER_REGISTRY_LOCAL_PORT}/node-exporter:latest
    container_name: node-exporter
    env_file:
      - ./.env
    ports:
      - ${NODE_EXPORTER_PORT}:${NODE_EXPORTER_PORT}
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - docker-network
    restart: always

  # 🧠 MySQL Exporter (mysql metrics)
  mysql-exporter:
    profiles: [ "infra" ]
    build:
      context: .
      dockerfile: Dockerfile.mysql-exporter
    image: localhost:${CONTAINER_REGISTRY_LOCAL_PORT}/mysql-exporter:latest
    container_name: mysql-exporter
    env_file:
      - ./.env
    ports:
      - ${MYSQL_EXPORTER_PORT}:${MYSQL_EXPORTER_PORT}
    depends_on:
      - mysql
    networks:
      - docker-network
    restart: always

  # ============================================================
  # Kubernetes Images (Build Only)
  # ============================================================
  # 🔐 MKCert CA Server
  ca-server:
    profiles: [ "cert-store" ]
    build:
      context: .
      dockerfile_inline: |
        FROM nginx:alpine
    image: localhost:${CONTAINER_REGISTRY_LOCAL_PORT}/ca-server:latest

  # 🧩 Container Registry Browser
  registry:
    profiles: [ "registry-browser" ]
    build:
      context: .
      dockerfile_inline: |
        FROM klausmeyer/docker-registry-browser:latest
        ARG CONTAINER_REGISTRY_NAME
        ARG CONTAINER_REGISTRY_PORT
        ENV DOCKER_REGISTRY_URL=http://${CONTAINER_REGISTRY_NAME}:${CONTAINER_REGISTRY_PORT}
        ARG REGISTRY_SECRET
        ENV SECRET_KEY_BASE=${REGISTRY_SECRET}
        ARG REGISTRY_SSL_DISABLED
        ENV NO_SSL_VERIFICATION=${REGISTRY_SSL_DISABLED}
        ARG REGISTRY_PORT
        ENV PORT=${REGISTRY_PORT}
      args:
        CONTAINER_REGISTRY_NAME: ${CONTAINER_REGISTRY_NAME}
        CONTAINER_REGISTRY_PORT: ${CONTAINER_REGISTRY_PORT}
        REGISTRY_SECRET: ${REGISTRY_SECRET}
        REGISTRY_SSL_DISABLED: ${REGISTRY_SSL_DISABLED}
        REGISTRY_PORT: ${REGISTRY_PORT}
    image: localhost:${CONTAINER_REGISTRY_LOCAL_PORT}/registry-browser:latest

  # 📈 Prometheus (metrics scraper)
  prometheus:
    profiles: [ "monitoring" ]
    build:
      context: .
      dockerfile_inline: |
        FROM prom/prometheus:latest
    image: localhost:${CONTAINER_REGISTRY_LOCAL_PORT}/prometheus:latest

  # 🌀 Grafana (dashboard)
  grafana:
    profiles: [ "monitoring" ]
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/grafana:latest
    image: localhost:${CONTAINER_REGISTRY_LOCAL_PORT}/grafana:latest

networks:
  docker-network:
    driver: bridge
    
volumes:
  registry-data:
  mysql-data:
  